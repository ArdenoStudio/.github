    <text x="28" y="26" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2">NO TEMPLATES</text>
  </g>
  <g transform="translate(530 396)">
    <rect width="166" height="40" rx="20" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="26" y="26" fill="#d8d8d8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2">SECURE BUILD</text>
  </g>
  <g transform="translate(714 396)">
    <rect width="192" height="40" rx="20" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="26" y="26" fill="#d8d8d8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2">LOCAL INTEL</text>
  </g>

